[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/dr-abdullah-photo.jpg"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/dr_abdullah_photo_v6.jpg"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
